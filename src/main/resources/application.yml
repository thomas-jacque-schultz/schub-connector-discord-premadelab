spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: connector.premadelab

server:
  port: 8080

schub:
  internal-secret: ${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

discord:
  token: ${DISCORD_PREMADELAB_TOKEN:}
